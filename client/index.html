<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborative Canvas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-container">
    <h2>🎨 Real-Time Collaborative Drawing Canvas</h2>

    <div id="toolbar">
      <label>Brush Color: <input type="color" id="colorPicker" value="#000000" /></label>
      <label>Brush Size: <input type="range" id="brushSize" min="1" max="20" value="3" /></label>
      <button id="drawBtn">Draw</button>
      <button id="eraserBtn">Eraser</button>
      <button id="undoBtn">Undo</button>
      <button id="redoBtn">Redo</button>
      <button id="clearBtn">Clear</button>

      <!-- Room selector -->
      <label style="margin-left:8px;">
        Room:
        <input id="roomInput" type="text" placeholder="main" style="width:90px; margin-left:6px;" />
      </label>
      <button id="joinRoomBtn">Join</button>
    </div>

    <canvas id="canvas" width="1000" height="600"></canvas>

    <div id="users">
      <h4>🧑‍🤝‍🧑 Active Users:</h4>
      <ul id="userList"></ul>
    </div>
  </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="canvas.js"></script>
    <script src="websocket.js"></script>
    <script src="main.js"></script>
</body>
</html>
